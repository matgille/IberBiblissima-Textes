name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

# Annule les runs obsolètes si plusieurs pushes arrivent à la suite
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------------
      # 1. Génération du README (racine) et des statistiques (stats/)
      # ------------------------------------------------------------------
      - name: Generate README and corpus stats
        run: python scripts/create_readme.py data

      # ------------------------------------------------------------------
      # 2. Dépendances de validation
      # ------------------------------------------------------------------
      - name: Install lxml
        run: |
          python -m pip install --upgrade pip
          pip install lxml

      - name: Install Jing (RelaxNG, parité oXygen)
        run: sudo apt-get install -y jing

      # ------------------------------------------------------------------
      # 3. Test des citeStructure (quelques secondes)
      # ------------------------------------------------------------------
      # - name: Check citeStructures
      #  run: python scripts/check_citestructure.py data

      # ------------------------------------------------------------------
      # 4. Validation RelaxNG (Jing) + Schematron embarqué de l'ODD
      # ------------------------------------------------------------------
      - name: Validate against ODD schema (Jing + Schematron)
        run: >
          python scripts/check_schema.py data
          schemata/out/ODD_gold.rng --jing --schematron

      # ------------------------------------------------------------------
      # 5. HookTest (long)
      # ------------------------------------------------------------------
      - name: Install HookTest
        run: pip install git+https://github.com/cllg-project/hooktest.git

      - name: Run HookTest
        run: hooktest collection.xml -v normal

      # ------------------------------------------------------------------
      # 6. Commit du README et des stats (même si HookTest échoue,
      #    et seulement sur push, pas sur les PR)
      # ------------------------------------------------------------------
      - name: Commit README and stats
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md stats/
          git diff --staged --quiet || git commit -m "Mise à jour du README et des statistiques [skip ci]"
          git push