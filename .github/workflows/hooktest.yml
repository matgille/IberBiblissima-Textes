name: CI

on:
  push:
  pull_request:

jobs:
  hooktest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HookTest
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/cllg-project/hooktest.git

      - name: Run HookTest
        run: hooktest collection.xml -v verbose