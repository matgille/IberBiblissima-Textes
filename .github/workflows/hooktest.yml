name: CI

on:
  push:
  pull_request:

# Droit d'écriture pour pousser le README et les stats
permissions:
  contents: write

jobs:
  hooktest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Génère le README (racine) et stats/ avant le test
      - name: Generate README and corpus stats
        run: python scripts/create_readme.py data


      - name: Install lxml
        run: pip install lxml

      - name: Validate against ODD schema (RelaxNG)
        run: python scripts/check_schema.py data schemata/out/ODD_gold.rng


      - name: Check citeStructures
        run: python scripts/check_citestructure.py data

      - name: Install HookTest
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/cllg-project/hooktest.git

      - name: Run HookTest
        run: hooktest collection.xml -v verbose

      # Commit et push, même si HookTest échoue
      - name: Commit README and stats
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md stats/
          git diff --staged --quiet || git commit -m "Mise à jour du README et des statistiques [skip ci]"
          git push
